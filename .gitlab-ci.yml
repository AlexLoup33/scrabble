# Docker image containing Maven and OpenJDK
image: maven:3.8.5-openjdk-17

# Global variables for Maven
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-B -e -V"

# Define pipeline stages
stages:
  - format
  - compile
  - test

format-job:
  stage: format
  tags:
    - "24.04"
    - CREMI
    - LTS
    - Noble
    - Ubuntu
    - amd64
    - shell
  script:
    - echo "Format stage"
    - cd scrabble
    - mvn spotless:check $MAVEN_CLI_OPTS || (
        echo "Code is not properly formatted. Applying Spotless...";
        mvn spotless:apply $MAVEN_CLI_OPTS;
        git diff --exit-code || (
            echo "Pushing formatted code back to repository...";
            git config user.name "CI Bot"
            git config user.email "ci-bot@scrabbleJAVA.com"
            git add .
            git commit -m "Apply code formatting with Spotless [CI]"
            git push
        )
      )
      
  # Allow this stage to fail without failing the entire pipeline
  allow_failure: true
  artifacts:
    paths:
      - scrabble/

compile-job:
  stage: compile
  tags:
    - "24.04"
    - CREMI
    - LTS
    - Noble
    - Ubuntu
    - amd64
    - shell
  script:
    - echo "Compile stage"
    - cd scrabble
    - mvn dependency:resolve $MAVEN_CLI_OPTS
    - mvn compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - scrabble/target/

test-job:
  stage: test
  tags:
    - "24.04"
    - CREMI
    - LTS
    - Noble
    - Ubuntu
    - amd64
    - shell
  script:
    - echo "Test stage"
    - cd scrabble
    - mvn test $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - scrabble/target/surefire-reports/
    when: always
