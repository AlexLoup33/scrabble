helpcontent=Here are some nice tips to help you:\n\
    - You can place words, exchange letters, or pass your turn with the buttons in front of you.\n\
    - In the center, there is the grid, and under it, the letters in your hand. Above that, you have some additional information about the game. On the left, you have the history, and on the right, the scores and remaining time.\n\
    - On the grid, the colors represent the multipliers as follows:\n\
        cyan is Double Letter, blue is Triple Letter, red is Double Word, and purple is Triple Word.