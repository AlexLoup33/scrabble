helpcontent=Ici quelques conseils pour vous aider :\n\
    - Vous pouvez placer des mots, échanger des lettres ou passer votre tour avec les boutons devant vous.\n\
    - Au centre, il y a la grille, et en dessous, les lettres dans votre main. Au-dessus de cela, vous avez quelques informations supplémentaires sur le jeu. A gauche, vous avez l'historique des actions, et à droite, le score de chaque joueur (ainsi que le temps restant en cas de blitz).\n\
    - Sur la grille, les couleurs représentent les multiplicateurs comme suit :\n\
        cyan est Lettre Double, bleu est Lettre Triple, rouge est Mot Double, et violet est Mot Triple.